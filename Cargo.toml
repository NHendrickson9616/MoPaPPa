[package]
name = "mopappa"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
candle-transformers = { version = "0.11.0", default-features = false }
hf-hub = "0.4.3"
serde_json = "1"
tiktoken-rs = "0.12.0"
tokenizers = "0.22.2"

[dev-dependencies]
syn = { version = "3", default-features = false, features = ["full", "parsing"] }
